<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Input Test Lab — Working</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #edf2f8;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(560px, 100%);
      padding: 36px;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 20px 60px rgba(25, 45, 75, 0.14);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 8vw, 3.6rem);
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 0 0 28px;
      color: #4a566d;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 750;
    }

    input,
    button {
      width: 100%;
      min-height: 50px;
      border-radius: 12px;
      font: inherit;
    }

    input {
      padding: 12px 14px;
      border: 2px solid #aebbd0;
    }

    button {
      margin-top: 12px;
      border: 0;
      background: #2457d6;
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 4px solid #f4b740;
      outline-offset: 3px;
    }

    #result {
      min-height: 56px;
      margin: 18px 0 0;
      padding: 14px;
      border-radius: 12px;
      background: #eef4ff;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Input Test Lab</h1>
    <p class="intro">Enter a whole number from 1 to 10. The page will show twice the number.</p>

    <label for="number-input">Whole number from 1 to 10</label>
    <input id="number-input" inputmode="numeric" autocomplete="off">
    <button id="check-button" type="button">Check the number</button>
    <p id="result" aria-live="polite">The result will appear here.</p>
  </main>

  <script>
    const input = document.querySelector("#number-input");
    const button = document.querySelector("#check-button");
    const result = document.querySelector("#result");

    button.addEventListener("click", () => {
      const rawValue = input.value.trim();

      if (rawValue === "") {
        result.textContent = "Enter a number before you continue.";
        return;
      }

      const number = Number(rawValue);

      if (!Number.isInteger(number)) {
        result.textContent = "Use a whole number.";
        return;
      }

      if (number < 1 || number > 10) {
        result.textContent = "Use a number from 1 to 10.";
        return;
      }

      result.textContent = `Result: ${number * 2}`;
    });
  </script>
</body>
</html>
