<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First Build</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(680px, 100%);
      padding: 40px;
      border: 1px solid #d9e1ee;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgba(31, 51, 78, 0.10);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 0 0 28px;
      color: #45516a;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .card {
      padding: 24px;
      border-radius: 18px;
      background: #eef4ff;
    }

    .card h2 {
      margin: 0 0 8px;
    }

    .card p {
      margin: 0;
      line-height: 1.6;
    }

    button {
      margin-top: 24px;
      padding: 14px 20px;
      border: 0;
      border-radius: 12px;
      background: #2457d6;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 4px solid #f4b740;
      outline-offset: 3px;
    }

    #result {
      min-height: 1.6em;
      margin: 16px 0 0;
      font-weight: 700;
    }

    @media (max-width: 520px) {
      main {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>My First Build</h1>
    <p class="intro">I am learning to build, test, and improve with AI.</p>

    <section class="card">
      <h2>Human in Control</h2>
      <p>AI can draft. I choose the goal and check the result.</p>
    </section>

    <button id="test-button" type="button">Test the page</button>
    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    const button = document.querySelector("#missing-button");
    const result = document.querySelector("#result");

    button.addEventListener("click", () => {
      result.textContent = "The button works!";
    });
  </script>
</body>
</html>
