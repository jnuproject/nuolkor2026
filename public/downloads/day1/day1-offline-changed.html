<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First Build</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #12213b;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(73, 132, 255, 0.42), transparent 38%),
        #12213b;
    }

    main {
      width: min(680px, 100%);
      padding: 40px;
      border-radius: 28px;
      background: #ffffff;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
    }

    .step {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #e8efff;
      color: #17429f;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 0 0 28px;
      color: #45516a;
      font-size: 1.12rem;
      line-height: 1.7;
    }

    .card {
      padding: 26px;
      border: 2px solid #2457d6;
      border-radius: 18px;
      background: #f3f7ff;
    }

    .card h2 {
      margin: 0 0 8px;
      color: #143d9a;
    }

    .card p {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.65;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 16px 20px;
      border: 0;
      border-radius: 12px;
      background: #2457d6;
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: #17429f;
    }

    button:focus-visible {
      outline: 4px solid #f4b740;
      outline-offset: 3px;
    }

    #result {
      min-height: 54px;
      margin: 16px 0 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #e9f8ef;
      color: #155d34;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 520px) {
      main {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <span class="step">Build · Test · Improve</span>
    <h1>My First Build</h1>
    <p class="intro">I am learning to build, test, and improve with AI.</p>

    <section class="card">
      <h2>Human in Control</h2>
      <p>AI can draft. I choose the goal and check the result.</p>
    </section>

    <button id="test-button" type="button">Test the page</button>
    <p id="result" aria-live="polite">Click the button to run the test.</p>
  </main>

  <script>
    const button = document.querySelector("#test-button");
    const result = document.querySelector("#result");

    button.addEventListener("click", () => {
      result.textContent = "The button works!";
    });
  </script>
</body>
</html>
