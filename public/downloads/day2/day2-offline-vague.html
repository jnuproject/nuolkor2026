<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Input Checker</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #eef1f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(640px, 100%);
      padding: 36px;
      border: 1px solid #d7dce5;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 20px 55px rgba(30, 42, 61, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 7vw, 3.8rem);
      letter-spacing: -0.04em;
    }

    p {
      color: #526078;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 28px;
      font-weight: 750;
    }

    input,
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 10px;
      border-radius: 12px;
      font: inherit;
    }

    input {
      border: 1px solid #aeb8c8;
      padding: 11px 14px;
    }

    button {
      border: 0;
      background: #4263eb;
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 4px solid #f3b61f;
      outline-offset: 3px;
    }

    #result {
      min-height: 54px;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #f3f5f8;
      color: #172033;
      font-weight: 750;
    }
  </style>
</head>
<body>
  <main>
    <h1>Input Checker</h1>
    <p>Enter something. This page will check it.</p>

    <label for="input-value">Input</label>
    <input id="input-value" type="text">
    <button id="check-button" type="button">Check</button>
    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    const input = document.querySelector("#input-value");
    const checkButton = document.querySelector("#check-button");
    const result = document.querySelector("#result");

    checkButton.addEventListener("click", () => {
      if (input.value.trim() === "") {
        result.textContent = "Please type something.";
        return;
      }

      result.textContent = "Looks good.";
    });
  </script>
</body>
</html>
