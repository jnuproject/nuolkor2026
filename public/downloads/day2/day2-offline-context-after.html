<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Precision Lab</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #14213d;
      background: #f1f5fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(660px, 100%);
      padding: 40px;
      border: 1px solid #cfdaea;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 22px 60px rgba(27, 54, 93, 0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4.2rem);
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .instruction {
      margin: 18px 0 28px;
      color: #4e5e78;
      font-size: 1.08rem;
      line-height: 1.6;
    }

    label {
      display: block;
      font-weight: 800;
    }

    input {
      width: 100%;
      min-height: 50px;
      margin-top: 10px;
      border: 1px solid #9eacc1;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    button {
      min-height: 50px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
    }

    #check-button {
      background: #2554c7;
      color: #ffffff;
    }

    #clear-button {
      border: 2px solid #2554c7;
      background: #ffffff;
      color: #183d91;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 4px solid #f1b92b;
      outline-offset: 3px;
    }

    #result {
      min-height: 56px;
      margin: 18px 0 0;
      display: grid;
      align-items: center;
      padding: 14px 16px;
      border-left: 5px solid #2554c7;
      border-radius: 10px;
      background: #eef4ff;
      font-weight: 800;
    }

    @media (max-width: 520px) {
      main {
        padding: 30px 22px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Prompt Precision Lab</h1>
    <p class="instruction">Enter a whole number from 1 to 10.</p>

    <label for="number-input">Number</label>
    <input id="number-input" type="text" inputmode="decimal" autocomplete="off">

    <div class="actions">
      <button id="check-button" type="button">Check input</button>
      <button id="clear-button" type="button">Clear</button>
    </div>

    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    const input = document.querySelector("#number-input");
    const checkButton = document.querySelector("#check-button");
    const clearButton = document.querySelector("#clear-button");
    const result = document.querySelector("#result");

    function checkInput() {
      const raw = input.value.trim();

      if (raw === "") {
        result.textContent = "Enter a value.";
        return;
      }

      const number = Number(raw);

      if (!Number.isFinite(number) || !Number.isInteger(number)) {
        result.textContent = "Use a whole number.";
        return;
      }

      if (number < 1 || number > 10) {
        result.textContent = "Use a number from 1 to 10.";
        return;
      }

      result.textContent = `Accepted: ${number}`;
    }

    function clearLab() {
      input.value = "";
      result.textContent = "";
      input.focus();
    }

    checkButton.addEventListener("click", checkInput);
    clearButton.addEventListener("click", clearLab);
  </script>
</body>
</html>
